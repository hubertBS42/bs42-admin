name: Send emails as a test

on:
 schedule:
  - cron: '*/2 * * * *' #Schedule to run every 2 minutes

jobs:
 send-email:
  runs-on: ubuntu-latest

  steps:
   - name: Checkout Repository
     uses: actions/checkout@v2

   - name: Set Up Node.js
     uses: actions/setup-node@v2
     with:
      node-version: '18.x'

   - name: Install Dependencies
     run: npm install

   - name: Send Email
     run: |
      curl -X POST https://portal.bs42.net/api/sendMail
